[project]
name = "freightcase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "martyn-v", email = "m@rtyn.io" }]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dotenv>=0.9.9",
    "langchain>=1.3.14",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.10",
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
]

[project.scripts]
freightcase = "freightcase:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Defaults (pyflakes + pycodestyle errors) plus import sorting and
# modern-syntax upgrades.
extend-select = ["I", "UP"]
